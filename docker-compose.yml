services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: estara
      POSTGRES_USER: estara
      POSTGRES_PASSWORD: estara
    ports: ["5432:5432"]
    volumes: ["estara_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estara -d estara"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["estara_os:/usr/share/opensearch/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["estara_s3:/data"]
volumes:
  estara_pg:
  estara_os:
  estara_s3:
