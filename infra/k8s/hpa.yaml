apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: estara-api-hpa
  namespace: estara
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: estara-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
