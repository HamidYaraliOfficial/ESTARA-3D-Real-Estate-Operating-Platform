apiVersion: apps/v1
kind: Deployment
metadata:
  name: estara-api
  namespace: estara
spec:
  replicas: 2
  selector:
    matchLabels: {app: estara-api}
  template:
    metadata: {labels: {app: estara-api}}
    spec:
      containers:
        - name: api
          image: estara/api:latest
          ports: [{containerPort: 4000}]
          envFrom: [{secretRef: {name: estara-secrets}}]
          readinessProbe: {httpGet: {path: /api/docs, port: 4000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /api/docs, port: 4000}, initialDelaySeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: estara-api
  namespace: estara
spec:
  selector: {app: estara-api}
  ports: [{port: 80, targetPort: 4000}]
